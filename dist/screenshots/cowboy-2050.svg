  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- subtle horizon -->
  <g transform="translate(0,360)">
    <ellipse cx="600" cy="240" rx="900" ry="140" fill="rgba(0,0,0,0.22)" />
  </g>

  <!-- stylized cowboy hat silhouette -->
  <g transform="translate(300,160) scale(1.2)">
    <path d="M90 120 C 30 120 10 100 0 80 C 20 70 70 60 110 58 C 150 60 200 70 220 80 C 210 100 190 120 130 120 C 120 140 60 140 90 120 Z"
      fill="url(#g2)" opacity="0.98" />
    <ellipse cx="110" cy="132" rx="92" ry="18" fill="#6b4b3a" opacity="0.28"/>
  </g>

  <!-- title -->
  <g transform="translate(80,460)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#fff">
      Cowboy
    </text>
    <text x="0" y="72" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="600" fill="#ffd27f">
      2050
    </text>
    <text x="0" y="130" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e6e6e6">
      Brand & Operational UX — demo placeholder
    </text>
